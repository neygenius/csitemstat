name: CI - Test and Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Линтинг и проверка форматирования
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  # Unit-тесты (моки, без внешних сервисов)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Set up environment variables
      run: |
        echo "BOT_TOKEN=123:abc" >> $GITHUB_ENV
        echo "WEBHOOK_SECRET=test_secret" >> $GITHUB_ENV
        echo "WEBHOOK_URL=https://example.com" >> $GITHUB_ENV
        echo "DB_USER=test_user" >> $GITHUB_ENV
        echo "DB_PASSWORD=test_pass" >> $GITHUB_ENV
        echo "DB_HOST=localhost" >> $GITHUB_ENV
        echo "DB_NAME=test_db" >> $GITHUB_ENV
        echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
        echo "STEAM_USERNAME=test_user" >> $GITHUB_ENV
        echo "STEAM_PASSWORD=test_pass" >> $GITHUB_ENV
        echo "STEAM_GUARD_FILE=/home/guard.maFile" >> $GITHUB_ENV
        echo "STEAM_AUTH_MODE=aiosteampy" >> $GITHUB_ENV
        echo "STEAM_SESSION_TTL=604800" >> $GITHUB_ENV
        echo "STEAM_COOKIES=" >> $GITHUB_ENV
        FERNET_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
        echo "FERNET_KEY=$FERNET_KEY" >> $GITHUB_ENV
        echo "APP_ID=730" >> $GITHUB_ENV

    - name: Run unit tests with coverage
      run: pytest -m unit --cov=app --cov-report=term-missing --cov-report=xml

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage.xml
        retention-days: 14