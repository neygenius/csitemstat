name: CI - Test and Lint

on:
  push:
    branches: [ main, master ]  # Запуск при пуше в основную ветку
  pull_request:
    branches: [ main, master ]  # Запуск при создании PR в основную ветку

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"] # Проверяем совместимость с разными версиями[reference:4]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # Установка зависимостей
        pip install pytest pytest-asyncio pytest-mock  # Установка тестовых зависимостей

    - name: Run tests with pytest
      run: |
        pytest -v  # Запуск тестов
